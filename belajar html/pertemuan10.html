<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Tabel</title>
</head>
<body>

  <h1>Membuat Tabel</h1>

  <!-- 1. Tabel Standar -->
  <h4>Tabel Standar</h4>
  <table border="1">
    <tr>
      <td>1</td>
      <td>2</td>
      <td>3</td>
    </tr>
    <tr>
      <td>4</td>
      <td>5</td>
      <td>6</td>
    </tr>
  </table>

  <br>

  <!-- 2. Tabel dengan Header (Samping & Atas) -->
  <h4>Dengan Header</h4>
  
  <!-- Header di samping (kiri) -->
  <table border="1">
    <tr>
      <th>Senin</th>
      <td>10.00</td>
      <td>12.00</td>
      <td>14.00</td>
    </tr>
  </table>

  <br>

  <!-- Header di atas -->
  <table border="1">
    <tr>
      <th>Senin</th>
      <th>Selasa</th>
    </tr>
    <tr>
      <td>10.00</td>
      <td>10.00</td>
    </tr>
    <tr>
      <td>11.00</td>
      <td>11.00</td>
    </tr>
  </table>

  <br>

  <!-- Gabungan Header Baris & Kolom -->
  <table border="1">
    <tr>
      <th>Senin</th>
      <td>berangkat sekolah</td>
    </tr>
    <tr>
      <th>12.00</th>
      <td>makan siang</td>
    </tr>
  </table>

  <br>

  <!-- 3. Tabel dengan Colspan & Rowspan (Merge Cell) -->
  <h4>Alokasi Kolom (Colspan & Rowspan)</h4>
  <table border="1">
    <tr>
      <th>Senin</th>
      <th>Selasa</th>
    </tr>
    <tr>
      <td>berangkat sekolah</td>
      <td>olahraga</td>
    </tr>
    <tr>
      <!-- Rowspan menyatukan 2 baris kebawah -->
      <td rowspan="2">12.00</td>
      <!-- Colspan menyatukan 2 kolom kesamping -->
      <td colspan="2">makan siang</td>
    </tr>
    <tr>
      <td colspan="2">sholat dhuhur</td>
    </tr>
  </table>

</body>
</html>
