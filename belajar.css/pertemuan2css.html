<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>belajar tentang CSS Inline</title>
</head>
<body>

    <!-- CSS Inline pada tag Heading 1 (h1) -->
    <h1 style="
        color: blue; 
        font-size: 50px;
    ">Hello CSS</h1>

    <!-- CSS Inline pada tag Paragraf (p) -->
    <p style="
        color: green; 
        font-size: 12px;
    ">
        halo nama saya faris saya kelas XI Rpl saya bersekolah di SMK Teratai Putih Global 4 Bekasi.
    </p>

</body>
</html>
